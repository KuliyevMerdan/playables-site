<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tap Eats — Playable Ad</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#14100e; touch-action:none; overscroll-behavior:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  #game { position:fixed; inset:0; display:block; }

  /* ---------- HUD ---------- */
  #hud { position:fixed; inset:0; pointer-events:none; }
  #hdr { position:absolute; top:calc(10px + env(safe-area-inset-top)); left:64px; right:104px; text-align:center; }
  #title { font-size:min(25px,5.7vw); font-weight:900; letter-spacing:2px; color:#ff7a45;
    text-shadow:0 2px 0 #7a2c0c, 0 4px 12px rgba(0,0,0,.6); }
  #sub { margin-top:3px; font-size:12px; font-weight:800; letter-spacing:3px; color:#9a8b80; }

  @media (orientation:portrait) and (max-height:620px){
    #title { font-size:min(19px,5.2vw); letter-spacing:1px; }
    #sub { font-size:10px; letter-spacing:2px; }
  }
  @media (orientation:landscape) and (max-height:520px){
    #hdr { top:calc(4px + env(safe-area-inset-top)); }
    #title { font-size:19px; letter-spacing:1px; }
    #sub { font-size:10px; display:inline-block; margin-left:9px; }
  }

  .btn { pointer-events:auto; cursor:pointer; border:none; font-weight:800; }
  #get { position:absolute; top:calc(12px + env(safe-area-inset-top)); right:12px; padding:9px 18px; border-radius:22px;
    background:linear-gradient(180deg,#42d76c,#149c46); color:#fff; font-size:15px; letter-spacing:1px;
    box-shadow:0 3px 0 #0c6b2e, 0 6px 14px rgba(0,0,0,.4); animation:pulse 1.6s ease-in-out infinite; }
  #mute { position:absolute; top:calc(12px + env(safe-area-inset-top)); left:12px; width:38px; height:38px; border-radius:50%;
    background:rgba(255,255,255,.12); color:#fff; font-size:17px; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.07)} }

  /* ---------- Toast ---------- */
  #toast { position:absolute; top:14%; left:0; right:0; text-align:center; font-size:min(32px,7.4vw); font-weight:900;
    color:#fff; text-shadow:0 3px 0 rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.6);
    opacity:0; transform:scale(.6); transition:all .25s cubic-bezier(.34,1.56,.64,1); }
  #toast.show { opacity:1; transform:scale(1); }
  #toast.good { color:#8affc1; } #toast.info { color:#ffd98a; }

  /* ---------- End card ---------- */
  #end { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    background:radial-gradient(ellipse at 50% 30%, #40251a 0%, #140d09 70%); opacity:0; pointer-events:none; transition:opacity .5s; }
  #end.show { opacity:1; pointer-events:auto; }
  #end .icon { width:92px; height:92px; border-radius:24px; display:flex; align-items:center; justify-content:center;
    font-size:50px; background:linear-gradient(160deg,#ffc59a,#ff7a45); box-shadow:0 10px 30px rgba(0,0,0,.55), inset 0 2px 4px #fff6; }
  #end h1 { color:#fff; font-size:min(29px,6.8vw); font-weight:900; text-align:center; padding:0 30px; text-shadow:0 3px 10px rgba(0,0,0,.45); }
  /* the receipt: the end card shows the order the user actually built */
  #receipt { width:min(360px,80vw); background:#fdf6ec; border-radius:14px; padding:16px 18px; color:#3a2a1c;
    box-shadow:0 10px 26px rgba(0,0,0,.5); font-size:15px; }
  #receipt .row { display:flex; justify-content:space-between; padding:3px 0; }
  #receipt .row.x { color:#8a7563; font-size:13px; }
  #receipt .tot { border-top:2px dashed #d7c3aa; margin-top:8px; padding-top:8px; font-weight:900; font-size:17px; }
  #end p  { color:#b39c8b; font-size:15px; text-align:center; padding:0 34px; line-height:1.35; }
  #cta { margin-top:2px; padding:17px 60px; border-radius:34px; font-size:22px; letter-spacing:1px; color:#fff;
    background:linear-gradient(180deg,#42d76c,#149c46); box-shadow:0 5px 0 #0c6b2e, 0 10px 24px rgba(0,0,0,.45);
    animation:pulse 1.4s ease-in-out infinite; }
  #replay { background:none; color:#8a7565; font-size:14px; text-decoration:underline; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="hdr"><div id="title">TAP EATS</div><div id="sub">DINNER IN 3 TAPS</div></div>
  <button class="btn" id="mute">🔊</button>
  <button class="btn" id="get">GET</button>
  <div id="toast"></div>
</div>
<div id="end">
  <div class="icon">🛵</div>
  <h1>Delivered in 12 min</h1>
  <div id="receipt"></div>
  <p id="endNote">Your first delivery is on us.</p>
  <button class="btn" id="cta">ORDER IN APP</button>
  <button class="btn" id="replay">↺ Watch again</button>
</div>

<script>
'use strict';
/* =========================================================================
   TAP EATS — self-contained playable ad (non-game brand playable)
   Scene designed in 720x1280 virtual units, letterbox-scaled to viewport.
   All timing runs on sim time (S.time) so the whole flow is headless-steppable
   through window.__game.tick().

   This is a SERVICE-APP FLOW demo, not a configurator: four screens — pick a
   dish, add extras, checkout, watch the courier — ending on a receipt of the
   order the viewer actually built. The sibling brand playable
   (../sneaker-studio) is the configurator pattern with DOM controls; this one
   draws its whole UI on canvas and hit-tests it, because a flow demo has to
   prove every screen is reachable and that is only testable if the layout,
   the renderer and the input all read the same rectangles.
   ========================================================================= */

/* =========================================================================
   CAMPAIGN — everything an advertiser owns. This is NOT just the store URL:
   prices, ratings, times, the delivery fee and both promotional lines are
   advertising claims, and unlike a placeholder URL they fail silently — a
   wrong "FREE delivery" ships, runs, and becomes the advertiser's problem.
   Replace the whole block per campaign; __game.audit() lists every field
   still holding its shipped default under `campaignPlaceholders`, which must
   be [] before a campaign goes live.
   ========================================================================= */
const CAMPAIGN = {
  storeURL:'https://apps.apple.com/app/id000000000',
  brand:'TAP EATS',
  tagline:'DINNER IN 3 TAPS',
  addressLabel:'Home',
  addressLine:'12 Harbour St · Apt 4',
  dishes:[
    {name:'Smash Burger',      price:990,  kind:'burger', tag:'4.9 ★ · 15 min'},
    {name:'Margherita Pizza',  price:1150, kind:'pizza',  tag:'4.8 ★ · 20 min'},
    {name:'Rainbow Poke Bowl', price:1220, kind:'bowl',   tag:'4.9 ★ · 18 min'},
  ],
  extras:[
    {name:'Skin-on fries', price:250, kind:'fries'},
    {name:'Iced cola',     price:160, kind:'cup'},
    {name:'Garlic dip',    price:90,  kind:'dip'},
    {name:'Choc cookie',   price:180, kind:'cookie'},
  ],
  deliveryFee:'FREE',
  promoFooter:'🎉  FREE delivery on your first order',
  courierName:'Ana · your courier',
  courierStats:'4.9 ★ · 320 deliveries',
  etaMinutes:12,
  endTitle:'Delivered in 12 min',
  endNote:'Your first delivery is on us.',
  ctaLabel:'ORDER IN APP',
};
/** snapshot taken before anything can touch it — the audit diffs against this */
const CAMPAIGN_SHIPPED = JSON.stringify(CAMPAIGN);

const CONFIG = {
  storeURL:CAMPAIGN.storeURL,                        // kept for parity with siblings
  stepT:0.34,            // s screen slide
  trackT:7.5,            // s the delivery run takes
  idleHint:2.6,          // s idle -> hand on the next control
  idleAuto:6.0,          // s idle -> the ad taps through itself
  autoStep:1.05,         // s between autopilot taps
  helpAfter:9.0,         // s stuck on one screen -> the flow advances itself
  deliverPause:1.6,      // s on DELIVERED before the end card
  autoEnd:95,            // s -> force end card
};

/* ---------- tiny helpers ---------- */
const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const rnd   = (a,b)=>a+Math.random()*(b-a);
const ease  = t=>t*t*(3-2*t);
const $ = id=>document.getElementById(id);
const vibe = p=>{ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} };
/** money is cents everywhere; a brand creative showing a wrong total is not a
    cosmetic bug, so nothing here ever touches a float */
const fmt = c=>'$'+(c/100).toFixed(2);

/* =========================================================================
   AUDIO — synthesized, no assets
   ========================================================================= */
const Sfx = {
  ctx:null, muted:false,
  ensure(){ if(!this.ctx){ try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
            if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  tone(f0,f1,dur,type,vol,when=0){
    if(!this.ctx||this.muted) return;
    const t=this.ctx.currentTime+when, o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t+dur+0.02);
  },
  tap(){  this.tone(520,380,0.06,'sine',0.06); },
  on(){   this.tone(660,990,0.09,'triangle',0.09); },
  off(){  this.tone(520,330,0.08,'triangle',0.06); },
  step(){ [587,880].forEach((f,i)=>this.tone(f,f,0.10,'triangle',0.09,i*0.06)); },
  order(){ [523,659,784,1047].forEach((f,i)=>this.tone(f,f,0.16,'triangle',0.14,i*0.07)); },
  scoot(){ this.tone(120,150,0.5,'sawtooth',0.035); },
  bell(){ [1319,1568].forEach((f,i)=>this.tone(f,f,0.22,'sine',0.13,i*0.10)); },
  win(){  [523,659,784,1047,1319].forEach((f,i)=>this.tone(f,f,0.20,'triangle',0.17,i*0.09)); },
};
$('mute').addEventListener('click',()=>{ Sfx.muted=!Sfx.muted; $('mute').textContent=Sfx.muted?'🔇':'🔊'; });

/* =========================================================================
   CTA / MRAID
   ========================================================================= */
/* Portfolio demo only: the showcase names the browsing context it mounts a
   playable into "pa-demo...", and a tap on the CTA then explains the button
   instead of opening the placeholder store page. A file handed to an ad
   network never carries that name, so its CTA path below is unchanged. */
const DEMO_CTA = String(window.name).indexOf('pa-demo') === 0;
function demoNotice(){
  let t=document.getElementById('demoNote');
  if(!t){
    t=document.createElement('div'); t.id='demoNote';
    t.innerHTML='<b>CTA \u2192 App Store</b><span>\u0412 \u043a\u0430\u043c\u043f\u0430\u043d\u0438\u0438 \u0437\u0434\u0435\u0441\u044c \u0441\u0441\u044b\u043b\u043a\u0430 \u0440\u0435\u043a\u043b\u0430\u043c\u043e\u0434\u0430\u0442\u0435\u043b\u044f</span>';
    t.style.cssText='position:fixed;left:50%;bottom:5%;transform:translate(-50%,10px);'+
      'display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;'+
      'padding:10px 16px;border-radius:12px;background:rgba(10,12,18,.93);color:#fff;'+
      'font:600 13px/1.3 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;'+
      'border:1px solid rgba(255,255,255,.18);box-shadow:0 10px 28px rgba(0,0,0,.5);'+
      'max-width:84%;z-index:99999;opacity:0;pointer-events:none';
    t.lastChild.style.cssText='font-weight:400;font-size:11px;opacity:.72';
    document.body.appendChild(t);
  }
  clearTimeout(t._hide);
  // Shown with no transition on purpose: a CSS transition only advances while
  // the frame is being rendered, and a browser throttling an offscreen iframe
  // leaves the notice stuck at opacity 0. Fading out is cosmetic, so it keeps one.
  t.style.transition='none'; t.style.opacity='1'; t.style.transform='translate(-50%,0)';
  t._hide=setTimeout(()=>{
    t.style.transition='opacity .25s ease,transform .25s ease';
    t.style.opacity='0'; t.style.transform='translate(-50%,10px)';
  },2400);
}
function openStore(){
  if(DEMO_CTA){ demoNotice(); return; }
  try{ if(window.mraid && mraid.open){ mraid.open(CONFIG.storeURL); return; } }catch(e){}
  window.open(CONFIG.storeURL,'_blank');
}
$('get').addEventListener('click',openStore);
$('cta').addEventListener('click',openStore);
$('replay').addEventListener('click',()=>{ $('end').classList.remove('show'); newRun(); });

/* =========================================================================
   RENDER SETUP — 720x1280 scene, letterboxed.
   Unlike sneaker-studio (which renders in viewport pixels because nothing on
   its canvas is hit-tested), every control here lives on the canvas, so the
   scene has to be a fixed coordinate system.
   ========================================================================= */
const cv=$('game'), ctx=cv.getContext('2d');
const SW=720, SH=1280;
let vw=0, vh=0, dpr=1, scale=1, ox=0, oy=0;
function resize(){
  vw=innerWidth; vh=innerHeight; dpr=Math.min(devicePixelRatio||1,2);
  cv.width=vw*dpr; cv.height=vh*dpr;
  cv.style.width=vw+'px'; cv.style.height=vh+'px';   // fixed inset:0 alone won't size a canvas
  scale=Math.min(vw/SW,vh/SH); ox=(vw-SW*scale)/2; oy=(vh-SH*scale)/2;
}
addEventListener('resize',resize); resize();
const toScene = (px,py)=>[(px-ox)/scale, (py-oy)/scale];

/* =========================================================================
   THE APP
   ========================================================================= */
const PANEL={x:40, y:232, w:640, h:968};          // the phone screen the flow lives in
const DISHES=CAMPAIGN.dishes, EXTRAS=CAMPAIGN.extras;
const STEPS=['PICK','EXTRAS','PAY','TRACK'];
const ADDRESS={label:CAMPAIGN.addressLabel, line:CAMPAIGN.addressLine};

/* =========================================================================
   STATE
   ========================================================================= */
const S = {
  step:0, time:0, mode:'run',       // run | end
  dish:-1, extras:{}, slide:0,
  track:0, delivered:false,
  taps:0, chipTaps:0, autos:0, helps:0,
  lastInput:0, lastStep:0, lastAuto:0, autoOn:false, handPh:0,
  parts:[], floats:[], timers:[], press:null, shake:0,
};
function later(sec,fn){ S.timers.push({t:S.time+sec,fn}); }
function newRun(){
  S.step=0; S.time=0; S.mode='run'; S.dish=-1; S.extras={}; S.slide=0;
  S.track=0; S.delivered=false; S.taps=0; S.chipTaps=0; S.autos=0; S.helps=0;
  S.lastInput=0; S.lastStep=0; S.lastAuto=0; S.autoOn=false; S.handPh=0;
  S.parts=[]; S.floats=[]; S.timers=[]; S.press=null; S.shake=0;
  $('end').classList.remove('show');
}
const dish = ()=>S.dish>=0?DISHES[S.dish]:null;
const extrasList = ()=>EXTRAS.filter((e,i)=>S.extras[i]);
/** the only place a total is computed — end card, checkout and audit all use it */
function total(){
  let c = dish()?dish().price:0;
  for(const e of extrasList()) c+=e.price;
  return c;
}

/* =========================================================================
   LAYOUT — one function returns every tappable rectangle for a screen.
   draw(), the hit test, the tutorial hand and audit() all read THIS, so a
   control cannot be drawn somewhere the player is unable to tap, and the
   audit can prove it for every screen without running the ad.
   ========================================================================= */
function layout(step){
  const R=[], PX=PANEL.x+30, PW=PANEL.w-60;
  if(step===0){
    for(let i=0;i<DISHES.length;i++)
      R.push({id:'dish'+i, kind:'dishcard', i, x:PX, y:404+i*196, w:PW, h:186});
  }else if(step===1){
    for(let i=0;i<EXTRAS.length;i++){
      const c=i%2, r=(i/2)|0;
      R.push({id:'extra'+i, kind:'chip', i, x:PX+c*(PW/2+8), y:742+r*104, w:PW/2-8, h:92});
    }
    R.push({id:'next', kind:'primary', label:'CONTINUE', x:PX, y:1064, w:PW, h:94});
  }else if(step===2){
    R.push({id:'addr', kind:'addr', x:PX, y:836, w:PW, h:104});
    R.push({id:'pay',  kind:'primary', label:'PLACE ORDER', x:PX, y:1064, w:PW, h:94});
  }
  return R;
}
const hitAt=(x,y)=>layout(S.step).find(r=>x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h)||null;

/* =========================================================================
   ACTIONS
   ========================================================================= */
function go(step){
  S.step=step; S.slide=0; S.lastStep=S.time; S.lastAuto=S.time;
  if(step===3){ Sfx.scoot(); toast('ORDER PLACED','good'); }
}
function act(r,byUser){
  if(!r || S.mode!=='run') return false;
  if(byUser!==false){ S.lastInput=S.time; S.handPh=0; }
  S.taps++;
  if(r.kind==='dishcard'){
    S.dish=r.i; Sfx.step(); vibe(12);
    burst(r.x+110, r.y+r.h/2, '#ff9c5c', 14);
    go(1); return true;
  }
  if(r.kind==='chip'){
    const on=!S.extras[r.i]; S.extras[r.i]=on; S.chipTaps++; S.lastStep=S.time;
    on?Sfx.on():Sfx.off(); vibe(8);
    S.floats.push({x:r.x+r.w/2, y:r.y+18, txt:(on?'+':'−')+fmt(EXTRAS[r.i].price).slice(1),
                   size:26, color:on?'#8affc1':'#ffb3a0', age:0, life:0.8});
    if(on) burst(r.x+r.w-34, r.y+r.h/2, '#8affc1', 8);
    return true;
  }
  if(r.kind==='addr'){ Sfx.tap(); vibe(6); return true; }        // decorative: no data entry, that is the pitch
  if(r.id==='next'){ Sfx.step(); vibe(10); go(2); return true; }
  if(r.id==='pay'){
    Sfx.order(); vibe([20,40,20]); confetti(SW/2, 780); S.shake=Math.max(S.shake,5);
    go(3); return true;
  }
  return false;
}
/** what the ad taps next; the tutorial hand points at the same rect */
function nextAction(){
  const R=layout(S.step);
  if(S.step===0) return R[0];
  if(S.step===1){
    for(const i of [0,1]) if(!S.extras[i]) return R.find(r=>r.id==='extra'+i);
    return R.find(r=>r.id==='next');
  }
  if(S.step===2) return R.find(r=>r.id==='pay');
  return null;
}
/** the control that actually moves the flow on — what the stuck-help uses, so
    a rescue can never spend itself toggling a chip */
function advanceControl(){
  const R=layout(S.step);
  if(S.step===0) return R[0];
  if(S.step===1) return R.find(r=>r.id==='next');
  if(S.step===2) return R.find(r=>r.id==='pay');
  return null;
}

/* =========================================================================
   INPUT
   ========================================================================= */
function pointerDown(e){
  Sfx.ensure(); S.lastInput=S.time; S.handPh=0; S.autoOn=false;
  if(S.mode!=='run') return;
  const p=toScene(e.clientX,e.clientY);
  const r=hitAt(p[0],p[1]);
  S.press=r?r.id:null;
}
function pointerUp(e){
  if(S.mode!=='run'){ S.press=null; return; }
  const p=toScene(e.clientX,e.clientY), r=hitAt(p[0],p[1]);
  if(r && S.press===r.id) act(r,true);
  S.press=null; S.lastInput=S.time;
}
cv.addEventListener('pointerdown',pointerDown);
addEventListener('pointerup',pointerUp);          // on window: the HUD buttons are
addEventListener('pointercancel',()=>{ S.press=null; });   // pointer-events:auto
// kill scroll/zoom, but never the DOM buttons: a cancelled touchstart also
// cancels the click that follows it, which would break the CTA on iOS.
document.addEventListener('touchstart',e=>{
  if(!(e.target instanceof Element) || !e.target.closest('.btn')) e.preventDefault();
},{passive:false});

/* =========================================================================
   PARTICLES / FLOATS
   ========================================================================= */
function burst(x,y,color,n){
  for(let i=0;i<n;i++) S.parts.push({x,y,vx:rnd(-200,200),vy:rnd(-250,70),
    life:rnd(.30,.60),age:0,color,r:rnd(2.5,5.5),grav:900,kind:'dot'});
}
function confetti(x,y){
  const cols=['#ff7a45','#42d76c','#ffd98a','#7ee0ff','#ff9ec4'];
  for(let i=0;i<90;i++) S.parts.push({x:x+rnd(-90,90),y,vx:rnd(-400,400),vy:rnd(-760,-250),
    life:rnd(.9,1.7),age:0,color:cols[i%cols.length],r:rnd(3,6),grav:980,rot:rnd(0,7),vr:rnd(-9,9),kind:'conf'});
}
function updateParts(dt){
  for(let i=S.parts.length-1;i>=0;i--){
    const p=S.parts[i]; p.age+=dt;
    if(p.age>p.life){ S.parts.splice(i,1); continue; }
    p.vy+=p.grav*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.rot!==undefined) p.rot+=p.vr*dt;
  }
  for(let i=S.floats.length-1;i>=0;i--){
    const f=S.floats[i]; f.age+=dt; f.y-=48*dt;
    if(f.age>f.life) S.floats.splice(i,1);
  }
}

/* =========================================================================
   FLOW
   ========================================================================= */
function toast(msg,cls){
  const t=$('toast'); t.textContent=msg; t.className=cls+' show';
  later(1.3,()=>t.classList.remove('show'));
}
function showEnd(){
  S.mode='end';
  const d=dish();
  const rows=[];
  if(d) rows.push(`<div class="row"><span>${d.name}</span><span>${fmt(d.price)}</span></div>`);
  for(const e of extrasList()) rows.push(`<div class="row x"><span>+ ${e.name}</span><span>${fmt(e.price)}</span></div>`);
  rows.push(`<div class="row tot"><span>Total</span><span>${fmt(total())}</span></div>`);
  $('receipt').innerHTML=rows.join('');
  $('end').querySelector('h1').textContent = S.delivered ? CAMPAIGN.endTitle : 'Hungry yet?';
  $('end').classList.add('show');
  Sfx.win();
}

/* =========================================================================
   UPDATE — everything on sim time
   ========================================================================= */
function update(dt){
  S.time+=dt;
  for(let i=S.timers.length-1;i>=0;i--){
    if(S.time>=S.timers[i].t){ const fn=S.timers[i].fn; S.timers.splice(i,1); fn(); }
  }
  updateParts(dt);
  if(S.slide<1) S.slide=Math.min(1,S.slide+dt/CONFIG.stepT);
  if(S.shake>0) S.shake=Math.max(0,S.shake-dt*24);
  if(S.mode==='run' && S.time-S.lastInput>=CONFIG.idleHint) S.handPh+=dt;

  if(S.step===3 && S.mode==='run'){                        // the delivery run
    if(S.track<1){
      S.track=Math.min(1,S.track+dt/CONFIG.trackT);
      if(S.track>=1 && !S.delivered){
        S.delivered=true; Sfx.bell(); vibe([25,40,25]);
        toast('DELIVERED!','good'); confetti(SW/2,700);
        later(CONFIG.deliverPause,showEnd);
      }
    }
  }else if(S.mode==='run'){
    // ad-safety 1: left alone, the ad taps through the flow itself
    if(S.autoOn || S.time-S.lastInput>CONFIG.idleAuto){
      S.autoOn=true;
      if(S.time-S.lastAuto>CONFIG.autoStep){
        S.lastAuto=S.time; const r=nextAction();
        if(r){ S.autos++; act(r,false); }
      }
    }
    // ad-safety 2: however the screen is being poked, the flow moves on
    else if(S.time-S.lastStep>CONFIG.helpAfter){
      const r=advanceControl();
      if(r){ S.helps++; toast('SKIPPING AHEAD','info'); act(r,false); }
    }
  }
  if(S.time>CONFIG.autoEnd && S.mode!=='end') showEnd();
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function txt(s,x,y,font,color,align){
  ctx.font=font; ctx.fillStyle=color; ctx.textAlign=align||'left'; ctx.textBaseline='middle';
  ctx.fillText(s,x,y);
}

/** the delivery map: blocks, a route polyline and a courier walking it by
    arc length, so the ETA and the icon can never disagree */
const ROUTE=[[0.10,0.86],[0.10,0.54],[0.44,0.54],[0.44,0.26],[0.80,0.26],[0.80,0.10]];
function routePoint(t,m){
  const pts=ROUTE.map(p=>[m.x+p[0]*m.w, m.y+p[1]*m.h]);
  const segs=[]; let tot=0;
  for(let i=0;i<pts.length-1;i++){ const L=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1]); segs.push(L); tot+=L; }
  let d=t*tot;
  for(let i=0;i<segs.length;i++){
    if(d<=segs[i]||i===segs.length-1){ const k=clamp(d/segs[i],0,1);
      return [pts[i][0]+(pts[i+1][0]-pts[i][0])*k, pts[i][1]+(pts[i+1][1]-pts[i][1])*k]; }
    d-=segs[i];
  }
  return pts[pts.length-1];
}

  ctx.fillText('🛵',bx+52,1114);
  txt(CAMPAIGN.courierName, bx+98, 1098, '800 19px system-ui', INK);
  txt(CAMPAIGN.courierStats, bx+98, 1128, '600 15px system-ui', DIM);
  ctx.fillStyle='#eaf7ee'; roundRect(bx+bw-108,1094,88,36,18); ctx.fill();
  txt('CALL', bx+bw-64, 1112, '800 15px system-ui', '#2e9b57', 'center');
}
function drawHand(){
  if(S.mode!=='run' || S.time-S.lastInput<CONFIG.idleHint || S.step===3) return;
  const r=nextAction(); if(!r) return;
  const k=(Math.sin(S.handPh*3.2)+1)/2;
  ctx.save();
  ctx.strokeStyle='rgba(255,122,69,'+(0.35+0.4*(1-k))+')'; ctx.lineWidth=5;
  roundRect(r.x-6,r.y-6,r.w+12,r.h+12,24); ctx.stroke();
  ctx.translate(r.x+r.w/2+26, r.y+r.h/2+34+k*10);
  ctx.font='52px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowColor='rgba(0,0,0,.5)'; ctx.shadowBlur=10;
  ctx.fillText('👆',0,0);
  ctx.restore();
}
function drawParts(){
  for(const p of S.parts){
    const a=1-p.age/p.life;
    ctx.globalAlpha=a; ctx.fillStyle=p.color;
    if(p.kind==='conf'){ ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r); ctx.restore(); }
    else { ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); }
  }
  ctx.globalAlpha=1;
}
function drawFloats(){
  for(const f of S.floats){
    const a=1-f.age/f.life;
    ctx.globalAlpha=a; ctx.fillStyle=f.color;
    ctx.font='900 '+f.size+'px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=4;
    ctx.strokeText(f.txt,f.x,f.y); ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1;
}
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);                 // draw in CSS px, sharp on retina
  drawBG();
  const sh=S.shake, shx=sh?rnd(-sh,sh)*scale:0, shy=sh?rnd(-sh,sh)*scale:0;
  ctx.save(); ctx.translate(ox+shx,oy+shy); ctx.scale(scale,scale);
  drawPanel();
  ctx.save();
  ctx.globalAlpha=ease(clamp(S.slide,0,1));                       // screens slide in
  ctx.translate((1-ease(clamp(S.slide,0,1)))*46,0);
  drawHeadline(S.step);
  if(S.step===1) drawTray();
  if(S.step===2) drawReceipt();
  if(S.step===3) drawMap();
  for(const r of layout(S.step)) drawControl(r);
  ctx.restore();
  drawHand();
  drawParts();
  drawFloats();
  ctx.restore();
}

/* =========================================================================
   MAIN LOOP
   ========================================================================= */
let last=performance.now();
function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min((t-last)/1000,1/30); last=t;
  update(dt);
  draw();
}

/* MRAID-aware start */
function applyCampaignCopy(){                       // the DOM half of the same block
  $('title').textContent=CAMPAIGN.brand;
  $('sub').textContent=CAMPAIGN.tagline;
  $('cta').textContent=CAMPAIGN.ctaLabel;
  $('endNote').textContent=CAMPAIGN.endNote;
}
function start(){ applyCampaignCopy(); newRun(); requestAnimationFrame(frame); }
try{
  if(window.mraid){
    if(mraid.getState()==='loading') mraid.addEventListener('ready',start); else start();
  } else start();
}catch(e){ start(); }

/* =========================================================================
   DEBUG HOOKS — headless stepping and verification
   ========================================================================= */
window.__game={ S, CONFIG, CAMPAIGN, DISHES, EXTRAS, layout, total, fmt, newRun, end:showEnd, next:nextAction,
  applyCampaignCopy,
  tick:(frames=1,dt=1/60)=>{ for(let i=0;i<frames;i++) update(dt); draw(); },
  tap:id=>act(layout(S.step).find(r=>r.id===id),true),
  tapAt:(x,y)=>act(hitAt(x,y),true),
  /** the flow as authored: every screen's controls fit the panel, meet a touch
      minimum and do not overlap — plus the money. A brand creative that shows a
      wrong total is not a cosmetic bug, so every reachable order is summed and
      re-parsed from its formatted string. */
  audit:()=>{
    const screens=[];
    for(let s=0;s<STEPS.length;s++){
      const R=layout(s), bad=[];
      for(const r of R){
        if(r.x<PANEL.x || r.y<PANEL.y+120 || r.x+r.w>PANEL.x+PANEL.w || r.y+r.h>PANEL.y+PANEL.h)
          bad.push(r.id+' outside panel');
        if(r.w<64||r.h<44) bad.push(r.id+' below touch minimum');
      }
      for(let i=0;i<R.length;i++) for(let j=i+1;j<R.length;j++){
        const a=R[i],b=R[j];
        if(a.x<b.x+b.w && b.x<a.x+a.w && a.y<b.y+b.h && b.y<a.y+a.h) bad.push(a.id+' overlaps '+b.id);
      }
      screens.push({screen:STEPS[s], controls:R.length, problems:bad,
                    advances: s<3 ? !!advanceControlFor(s) : true});
    }
    const keepD=S.dish, keepE=S.extras; let combos=0, money=[];
    for(let d=0;d<DISHES.length;d++) for(let m=0;m<16;m++){
      S.dish=d; S.extras={}; for(let b=0;b<4;b++) if(m&(1<<b)) S.extras[b]=true;
      let ref=DISHES[d].price; for(let b=0;b<4;b++) if(m&(1<<b)) ref+=EXTRAS[b].price;
      const t=total(), back=Math.round(parseFloat(fmt(t).slice(1))*100);
      combos++;
      if(t!==ref || back!==ref) money.push(`${DISHES[d].name}/${m}: ${t} vs ${ref} (${fmt(t)})`);
    }
    S.dish=keepD; S.extras=keepE;
    // every campaign-owned field still holding its shipped default. Expected to
    // be long in this build; a campaign build must drive it to [].
    const shipped=JSON.parse(CAMPAIGN_SHIPPED), ph=[];
    for(const k in shipped) if(JSON.stringify(CAMPAIGN[k])===JSON.stringify(shipped[k])) ph.push(k);
    return {screens, moneyCombosChecked:combos, moneyMismatches:money,
            campaignPlaceholders:ph, campaignFields:Object.keys(shipped).length,
            minTotal:fmt(DISHES[0].price),
            maxTotal:fmt(DISHES[2].price+EXTRAS.reduce((s,e)=>s+e.price,0))};
  },
  /** untouched impression: the ad taps through its own flow */
  solve:(maxSec=90,dt=1/30)=>{
    S.time=0; newRun(); S.lastInput=-999; S.autoOn=true;
    const marks=[]; let st=-1;
    for(let i=0;i<maxSec/dt && S.mode!=='end'; i++){
      update(dt);
      if(S.step!==st){ st=S.step; marks.push(`t=${S.time.toFixed(1)} ${STEPS[st]}`); }
    }
    return { finished:S.mode==='end', t:+S.time.toFixed(1), delivered:S.delivered,
             dish:dish()&&dish().name, extras:extrasList().map(e=>e.name), total:fmt(total()),
             taps:S.taps, helps:S.helps, marks };
  },
  /** somebody poking the screen at random, never idle enough for the autopilot.
      Proves the stuck-help gets every impression to the end card. */
  stress:(trials=60,maxSec=140,seed=12345,dt=1/30)=>{
    let z=seed>>>0; const rand=()=>{ z=(z*1664525+1013904223)>>>0; return z/4294967296; };
    let ok=0, sum=0, worst=0, helps=0;
    for(let n=0;n<trials;n++){
      S.time=0; newRun(); S.autoOn=false; let acc=0;
      for(let i=0;i<maxSec/dt && S.mode!=='end'; i++){
        update(dt);
        S.lastInput=S.time;                        // an ACTIVE user: autopilot never engages
        acc+=dt;
        if(acc>=0.6){ acc=0; const r=hitAt(rand()*SW, rand()*SH); if(r) act(r,true); }
      }
      if(S.mode==='end' && S.delivered){ ok++; sum+=S.time; worst=Math.max(worst,S.time); helps+=S.helps; }
    }
    return { trials, completed:ok, rate:+(ok/trials).toFixed(3), avgSec:+(sum/Math.max(ok,1)).toFixed(1),
             worstSec:+worst.toFixed(1), avgSkips:+(helps/Math.max(ok,1)).toFixed(2) };
  },
};
function advanceControlFor(s){
  const R=layout(s);
  if(s===0) return R[0];
  if(s===1) return R.find(r=>r.id==='next');
  if(s===2) return R.find(r=>r.id==='pay');
  return null;
}
</script>
