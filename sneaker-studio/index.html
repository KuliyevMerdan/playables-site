<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Stride Studio — Playable Ad</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#12141f; touch-action:none; overscroll-behavior:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  #game { position:fixed; inset:0; display:block; }

  /* ---------- HUD ---------- */
  #hud { position:fixed; inset:0; pointer-events:none; }
  #hdr { position:absolute; top:calc(10px + env(safe-area-inset-top)); left:60px; right:60px; text-align:center; }
  #brand { display:inline-block; padding:3px 12px; border-radius:14px; font-size:12px; font-weight:900; letter-spacing:3px;
    color:#12141f; background:linear-gradient(180deg,#fff,#cfd6e6); box-shadow:0 2px 8px rgba(0,0,0,.4); }
  #title { margin-top:6px; font-size:min(24px,5.6vw); font-weight:900; letter-spacing:2px; color:#fff;
    text-shadow:0 2px 0 rgba(0,0,0,.4), 0 6px 16px rgba(0,0,0,.5); }
  #prog { display:inline-block; margin-top:7px; padding:5px 14px; border-radius:16px; background:rgba(0,0,0,.35);
    color:#ffd54a; font-weight:800; font-size:13px; letter-spacing:1px; }

  .btn { pointer-events:auto; cursor:pointer; border:none; font-weight:800; }
  #get { position:absolute; top:calc(12px + env(safe-area-inset-top)); right:12px; padding:9px 18px; border-radius:22px;
    background:linear-gradient(180deg,#42d76c,#149c46); color:#fff; font-size:15px; letter-spacing:1px;
    box-shadow:0 3px 0 #0c6b2e, 0 6px 14px rgba(0,0,0,.4); animation:pulse 1.6s ease-in-out infinite; }
  #mute { position:absolute; top:calc(12px + env(safe-area-inset-top)); left:12px; width:38px; height:38px; border-radius:50%;
    background:rgba(255,255,255,.12); color:#fff; font-size:17px; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.07)} }

  #toast { position:absolute; top:26%; left:0; right:0; text-align:center; font-size:30px; font-weight:900;
    color:#fff; text-shadow:0 3px 0 rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.5);
    opacity:0; transform:scale(.6); transition:all .25s cubic-bezier(.34,1.56,.64,1); pointer-events:none; }
  #toast.show { opacity:1; transform:scale(1); }

  /* ---------- Configurator panel ---------- */
  #panel { position:fixed; left:50%; bottom:calc(10px + env(safe-area-inset-bottom)); transform:translateX(-50%);
    width:min(420px,94vw); padding:12px 12px 10px; border-radius:22px;
    background:rgba(16,18,30,.78); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.09); box-shadow:0 12px 34px rgba(0,0,0,.5); }
  #tabs { display:flex; gap:6px; }
  .tab { flex:1; padding:9px 2px; border-radius:12px; background:rgba(255,255,255,.07); color:#8b93ad;
    font-size:12px; font-weight:900; letter-spacing:1px; position:relative; transition:all .18s; }
  .tab.on { background:linear-gradient(180deg,#fff,#dbe2f2); color:#12141f; transform:translateY(-2px);
    box-shadow:0 4px 12px rgba(0,0,0,.35); }
  .tab .tick { position:absolute; top:-6px; right:-4px; width:18px; height:18px; border-radius:50%;
    background:linear-gradient(180deg,#42d76c,#149c46); color:#fff; font-size:11px; line-height:18px;
    box-shadow:0 2px 6px rgba(0,0,0,.4); opacity:0; transform:scale(.3); transition:all .25s cubic-bezier(.34,1.56,.64,1); }
  .tab.done .tick { opacity:1; transform:scale(1); }
  #swatches { display:flex; justify-content:space-between; gap:8px; margin-top:12px; padding:0 2px; }
  .sw { width:min(46px,13vw); aspect-ratio:1; height:auto; border-radius:50%; border:3px solid rgba(255,255,255,.25);
    box-shadow:inset 0 -6px 10px rgba(0,0,0,.25), 0 3px 8px rgba(0,0,0,.4); transition:transform .15s; }
  .sw:active { transform:scale(.9); }
  .sw.sel { border-color:#fff; transform:scale(1.14); box-shadow:0 0 0 3px rgba(255,255,255,.25), 0 4px 12px rgba(0,0,0,.5); }
  #done { display:block; width:100%; margin-top:12px; padding:13px; border-radius:16px; font-size:17px; letter-spacing:1px;
    color:#fff; background:linear-gradient(180deg,#ffb300,#e8890b); box-shadow:0 4px 0 #9c5c06, 0 8px 18px rgba(0,0,0,.45);
    opacity:0; transform:scale(.85); pointer-events:none; transition:all .3s cubic-bezier(.34,1.56,.64,1); }
  #done.show { opacity:1; transform:scale(1); pointer-events:auto; animation:pulse 1.4s ease-in-out infinite; }

  @media (orientation:landscape){
    #panel { left:auto; right:10px; bottom:10px; transform:none; width:min(380px,46vw); }
    #hdr { left:60px; right:auto; text-align:left; }
    #title { font-size:20px; }
  }

  /* ---------- Tutorial hand ---------- */
  #hand { position:fixed; left:0; top:0; font-size:44px; z-index:30; pointer-events:none; opacity:0;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,.5)); transition:left .5s ease, top .5s ease; }
  #hand.show { opacity:1; animation:tapAnim .9s ease-in-out infinite; }
  @keyframes tapAnim { 0%,100%{transform:translate(-30%,-8%) scale(1)} 50%{transform:translate(-30%,-8%) scale(.82)} }

  /* ---------- End card ---------- */
  #end { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    background:radial-gradient(ellipse at 50% 30%, #333a5e 0%, #0d0e18 72%); opacity:0; pointer-events:none; transition:opacity .5s; z-index:40; }
  #end.show { opacity:1; pointer-events:auto; }
  #endCv { width:min(340px,80vw); }
  #end h1 { color:#fff; font-size:28px; font-weight:900; text-align:center; padding:0 30px; text-shadow:0 3px 10px rgba(0,0,0,.4); }
  #end .sku { color:#a9b3e0; font-size:15px; margin-top:-6px; }
  #end .price { color:#ffd54a; font-size:22px; font-weight:900; }
  #cta { padding:17px 58px; border-radius:34px; font-size:21px; letter-spacing:1px; color:#fff;
    background:linear-gradient(180deg,#42d76c,#149c46); box-shadow:0 5px 0 #0c6b2e, 0 10px 24px rgba(0,0,0,.45);
    animation:pulse 1.4s ease-in-out infinite; }
  #replay { background:none; color:#8f88bd; font-size:14px; text-decoration:underline; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="hdr">
    <div id="brand">STRIDE&reg;</div>
    <div id="title">DESIGN YOUR PAIR</div>
    <div><span id="prog">0 / 4 STYLED</span></div>
  </div>
  <button class="btn" id="mute">🔊</button>
  <button class="btn" id="get">GET</button>
  <div id="toast"></div>
</div>
<div id="panel">
  <div id="tabs"></div>
  <div id="swatches"></div>
  <button class="btn" id="done">FINISH MY PAIR ✓</button>
</div>
<div id="hand">👆</div>
<div id="end">
  <canvas id="endCv"></canvas>
  <h1>Your pair is ready! 🔥</h1>
  <p class="sku">STRIDE One &middot; Custom colorway</p>
  <p class="price">$129 &middot; free shipping in-app</p>
  <button class="btn" id="cta">ORDER IN APP</button>
  <button class="btn" id="replay">↺ Design another</button>
</div>

<script>
'use strict';
/* =========================================================================
   STRIDE STUDIO — non-game brand playable (sneaker configurator).
   All UI is DOM; the sneaker is vector-drawn each frame on canvas in
   viewport pixels (no letterbox needed — nothing positional to hit-test).
   All timing runs on accumulated sim-time (S.time) → headless-steppable.
   ========================================================================= */

const CONFIG = {
  storeURL: 'https://apps.apple.com/app/id000000000',   // replace per campaign
  idleHint: 4,          // s of idle before tutorial hand
  advanceDelay: 0.5,    // s before auto-advancing to next unstyled zone
  autoEnd: 60,          // s — hard stop, always reach the end card
};

const ZONES = [
  { id:'body',   label:'BODY',   def:'#eef0f4',
    pal:['#f4f4f6','#2b2f3a','#ff5470','#4fc3f7','#5ad07a','#ffb300'] },
  { id:'sole',   label:'SOLE',   def:'#ffffff',
    pal:['#ffffff','#1c1f27','#ff8a5c','#7ee0ff','#c8f05a','#b388ff'] },
  { id:'laces',  label:'LACES',  def:'#f2f3f6',
    pal:['#ffffff','#22252e','#ff5470','#4fc3f7','#ffd54a','#5ad07a'] },
  { id:'accent', label:'TRIM',   def:'#c9cfdd',
    pal:['#ff3d61','#ffd54a','#22252e','#4fc3f7','#b388ff','#12e0a8'] },
];
const WORDS=['NICE!','FRESH!','CLEAN 🔥','HEAT 🔥','SLICK!','BOLD!'];

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const $=id=>document.getElementById(id);
const vibe=p=>{ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} };
const hex2rgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const css=c=>'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')';
const shade=(c,f)=>[c[0]*f,c[1]*f,c[2]*f];
const tint=(c,f)=>[c[0]+(255-c[0])*f,c[1]+(255-c[1])*f,c[2]+(255-c[2])*f];
const mix=(a,b,f)=>[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f,a[2]+(b[2]-a[2])*f];

/* ========================= AUDIO (synth, no assets) ====================== */
const Sfx = {
  ctx:null, muted:false,
  ensure(){ if(!this.ctx){ try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
            if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  tone(f0,f1,dur,type,vol,when=0){
    if(!this.ctx||this.muted) return;
    const t=this.ctx.currentTime+when, o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t+dur+0.02);
  },
  pick(i){ const f=420*Math.pow(1.12,i);
    this.tone(f,f*1.25,0.10,'square',0.13); this.tone(f*2,f*1.7,0.08,'sine',0.06,0.01); },
  tab(){ this.tone(300,380,0.06,'sine',0.08); },
  win(){ [523,659,784,1047,1319].forEach((f,i)=>this.tone(f,f,0.18,'triangle',0.2,i*0.08)); },
};
$('mute').addEventListener('click',()=>{ Sfx.muted=!Sfx.muted; $('mute').textContent=Sfx.muted?'🔇':'🔊'; });

/* ========================= CTA / MRAID =================================== */
/* Portfolio demo only: the showcase names the browsing context it mounts a
   playable into "pa-demo...", and a tap on the CTA then explains the button
   instead of opening the placeholder store page. A file handed to an ad
   network never carries that name, so its CTA path below is unchanged. */
const DEMO_CTA = String(window.name).indexOf('pa-demo') === 0;
function demoNotice(){
  let t=document.getElementById('demoNote');
  if(!t){
    t=document.createElement('div'); t.id='demoNote';
    t.innerHTML='<b>CTA \u2192 App Store</b><span>\u0412 \u043a\u0430\u043c\u043f\u0430\u043d\u0438\u0438 \u0437\u0434\u0435\u0441\u044c \u0441\u0441\u044b\u043b\u043a\u0430 \u0440\u0435\u043a\u043b\u0430\u043c\u043e\u0434\u0430\u0442\u0435\u043b\u044f</span>';
    t.style.cssText='position:fixed;left:50%;bottom:5%;transform:translate(-50%,10px);'+
      'display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;'+
      'padding:10px 16px;border-radius:12px;background:rgba(10,12,18,.93);color:#fff;'+
      'font:600 13px/1.3 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;'+
      'border:1px solid rgba(255,255,255,.18);box-shadow:0 10px 28px rgba(0,0,0,.5);'+
      'max-width:84%;z-index:99999;opacity:0;pointer-events:none';
    t.lastChild.style.cssText='font-weight:400;font-size:11px;opacity:.72';
    document.body.appendChild(t);
  }
  clearTimeout(t._hide);
  // Shown with no transition on purpose: a CSS transition only advances while
  // the frame is being rendered, and a browser throttling an offscreen iframe
  // leaves the notice stuck at opacity 0. Fading out is cosmetic, so it keeps one.
  t.style.transition='none'; t.style.opacity='1'; t.style.transform='translate(-50%,0)';
  t._hide=setTimeout(()=>{
    t.style.transition='opacity .25s ease,transform .25s ease';
    t.style.opacity='0'; t.style.transform='translate(-50%,10px)';
  },2400);
}
function openStore(){
  if(DEMO_CTA){ demoNotice(); return; }
  try{ if(window.mraid && mraid.open){ mraid.open(CONFIG.storeURL); return; } }catch(e){}
  window.open(CONFIG.storeURL,'_blank');
}
$('get').addEventListener('click',openStore);
$('cta').addEventListener('click',openStore);
$('replay').addEventListener('click',()=>{ $('end').classList.remove('show'); newGame(); });

/* ========================= STATE ========================================= */
const S={
  phase:'play',            // play | over
  step:0,                  // active zone index
  colors:{},               // id -> {cur:[r,g,b], tgt:[r,g,b], picked, sel}
  time:0, lastInput:0,
  rot:0, rotV:0, pulse:0,  // spring wobble + scale pulse on pick
  advanceAt:-1, endAt:-1,
  parts:[], floats:[],
};
for(const z of ZONES) S.colors[z.id]={cur:hex2rgb(z.def),tgt:hex2rgb(z.def),picked:false,sel:-1};

const pickedCount=()=>ZONES.reduce((n,z)=>n+(S.colors[z.id].picked?1:0),0);
const nextUnpicked=()=>{ for(let i=0;i<ZONES.length;i++){ const j=(S.step+1+i)%ZONES.length;
  if(!S.colors[ZONES[j].id].picked) return j; } return -1; };

/* ========================= UI (tabs / swatches) ========================== */
const tabEls=[], swEls=[];
for(let i=0;i<ZONES.length;i++){
  const b=document.createElement('button');
  b.className='btn tab'; b.innerHTML=ZONES[i].label+'<span class="tick">✓</span>';
  b.addEventListener('click',()=>{ Sfx.ensure(); Sfx.tab(); setStep(i); S.lastInput=S.time; });
  $('tabs').appendChild(b); tabEls.push(b);
}
for(let i=0;i<6;i++){
  const b=document.createElement('button');
  b.className='btn sw';
  b.addEventListener('click',()=>{ Sfx.ensure(); pick(S.step,i); });
  $('swatches').appendChild(b); swEls.push(b);
}
function uiSync(){
  const z=ZONES[S.step], st=S.colors[z.id];
  tabEls.forEach((b,i)=>{ b.classList.toggle('on',i===S.step);
    b.classList.toggle('done',S.colors[ZONES[i].id].picked); });
  swEls.forEach((b,i)=>{ b.style.background=z.pal[i]; b.classList.toggle('sel',st.sel===i); });
  $('prog').textContent=pickedCount()+' / 4 STYLED';
  $('done').classList.toggle('show',pickedCount()===4&&S.phase==='play');
}
function setStep(i){ S.step=clamp(i,0,ZONES.length-1); uiSync(); }

function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),900);
}

/* ========================= CORE ACTIONS ================================== */
function pick(zi,ci){
  if(S.phase!=='play') return false;
  const z=ZONES[zi], st=S.colors[z.id];
  if(!z||ci<0||ci>5) return false;
  S.lastInput=S.time;
  const first=!st.picked;
  st.tgt=hex2rgb(z.pal[ci]); st.picked=true; st.sel=ci;
  S.rotV+=rnd(2.2,3.2)*(Math.random()<0.5?-1:1); S.pulse=1;
  Sfx.pick(ci); vibe(15);
  const [sx,sy]=shoeCenter();
  burst(sx,sy,z.pal[ci],14);
  S.floats.push({x:sx+rnd(-40,40),y:sy-shoeScale()*160,txt:WORDS[(zi*2+ci)%WORDS.length],
    size:30,color:'#fff',age:0,life:0.9});
  if(first && pickedCount()<4){ S.advanceAt=S.time+CONFIG.advanceDelay; }
  if(pickedCount()===4 && first){ toast('LOOKING SHARP!'); }
  uiSync();
  return true;
}
function finish(){
  if(S.phase!=='play') return;
  S.phase='over'; S.endAt=S.time+1.1;
  Sfx.win(); vibe([30,40,30]);
  const [sx,sy]=shoeCenter();
  confetti(sx,sy-80);
  toast('YOUR PAIR IS READY!');
  uiSync();
}
$('done').addEventListener('click',()=>{ Sfx.ensure(); finish(); });
function showEnd(){ renderEndShoe(); $('end').classList.add('show'); }
function newGame(){
  for(const z of ZONES){ const st=S.colors[z.id];
    st.cur=hex2rgb(z.def); st.tgt=hex2rgb(z.def); st.picked=false; st.sel=-1; }
  S.phase='play'; S.step=0; S.time=0; S.lastInput=0;
  S.rot=0; S.rotV=0; S.pulse=0; S.advanceAt=-1; S.endAt=-1;
  S.parts=[]; S.floats=[];
  uiSync();
}

/* ========================= PARTICLES / FLOATS ============================ */
function burst(x,y,color,n){ const s=shoeScale();
  for(let i=0;i<n&&S.parts.length<260;i++)
    S.parts.push({x:x+rnd(-90,90)*s,y:y+rnd(-120,20)*s,vx:rnd(-160,160)*s,vy:rnd(-320,-80)*s,
      life:rnd(.4,.7),age:0,color,r:rnd(2.5,5)*s+1,grav:800*s,kind:'dot'}); }
function confetti(x,y){ const cols=['#ffd54a','#42d76c','#ff6b9d','#5ac8fa','#ff9f43'], s=shoeScale();
  for(let i=0;i<90;i++) S.parts.push({x:x+rnd(-60,60),y,vx:rnd(-340,340)*s,vy:rnd(-640,-220)*s,
    life:rnd(.9,1.6),age:0,color:cols[i%cols.length],r:rnd(3,6)*s+1,grav:820*s,rot:rnd(0,7),vr:rnd(-8,8),kind:'conf'}); }

/* ========================= UPDATE (headless-steppable) =================== */
function update(dt){
  S.time+=dt;
  for(const z of ZONES){ const st=S.colors[z.id];
    st.cur=mix(st.cur,st.tgt,Math.min(1,dt*8)); }
  S.rotV+=(-S.rot*90-S.rotV*7)*dt; S.rot+=S.rotV*dt;
  S.pulse=Math.max(0,S.pulse-dt*3);
  if(S.advanceAt>=0&&S.time>=S.advanceAt){ S.advanceAt=-1;
    const n=nextUnpicked(); if(n>=0&&S.phase==='play'){ setStep(n); toast('NOW: '+ZONES[n].label); Sfx.tab(); } }
  for(let i=S.parts.length-1;i>=0;i--){
    const p=S.parts[i]; p.age+=dt; if(p.age>p.life){ S.parts.splice(i,1); continue; }
    p.vy+=p.grav*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.rot!==undefined) p.rot+=p.vr*dt;
  }
  for(let i=S.floats.length-1;i>=0;i--){
    const f=S.floats[i]; f.age+=dt; f.y-=46*dt; if(f.age>f.life) S.floats.splice(i,1);
  }
  if(S.endAt>=0&&S.time>=S.endAt){ S.endAt=-1; showEnd(); }
  if(S.phase==='play'&&S.time>CONFIG.autoEnd) finish();
}

/* ========================= RENDER ======================================== */
const cv=$('game'), ctx=cv.getContext('2d');
let vw=0,vh=0,dpr=1;
function resize(){ vw=innerWidth; vh=innerHeight; dpr=Math.min(devicePixelRatio||1,2);
  cv.width=vw*dpr; cv.height=vh*dpr;
  cv.style.width=vw+'px'; cv.style.height=vh+'px'; }
addEventListener('resize',resize); resize();

const panelW=()=>vw>vh ? Math.min(380,vw*0.46)+34 : 0;   // side panel + gaps
function shoeScale(){ return vw>vh
  ? Math.min((vw-panelW())/620,(vh-170)/260)
  : Math.min(vw/760,vh/1500); }
function shoeCenter(){ return vw>vh
  ? [(vw-panelW())/2, vh-80]
  : [vw/2, vh*0.40]; }

/* ---- the sneaker: layered vector art in local coords (ground y=0, up<0) -- */
function drawSneaker(g){
  const c=id=>S.colors[id].cur;
  const F=(id,f)=>css(shade(c(id),f)), L=(id,f)=>css(tint(c(id),f));
  const grad=(id,y0,y1)=>{ const gr=g.createLinearGradient(0,y0,0,y1);
    gr.addColorStop(0,L(id,0.22)); gr.addColorStop(1,F(id,0.86)); return gr; };
  g.lineJoin='round'; g.lineCap='round';

  // SOLE
  const sole=()=>{ g.beginPath();
    g.moveTo(-242,-8);
    g.quadraticCurveTo(-254,-30,-238,-52);
    g.quadraticCurveTo(-110,-66,30,-58);
    g.quadraticCurveTo(170,-52,246,-64);
    g.quadraticCurveTo(268,-40,250,-12);
    g.quadraticCurveTo(120,6,-70,4);
    g.quadraticCurveTo(-180,4,-242,-8);
    g.closePath(); };
  sole(); g.fillStyle=grad('sole',-64,4); g.fill();
  g.save(); sole(); g.clip();
  g.fillStyle=F('sole',0.68); g.fillRect(-270,-14,550,22);          // tread strip
  g.restore();
  sole(); g.strokeStyle=F('sole',0.55); g.lineWidth=3; g.stroke();

  // BODY (upper) silhouette
  const body=()=>{ g.beginPath();
    g.moveTo(246,-58);
    g.quadraticCurveTo(226,-102,158,-124);
    g.quadraticCurveTo(104,-142,46,-152);
    g.lineTo(-36,-164);
    g.quadraticCurveTo(-66,-194,-138,-196);
    g.quadraticCurveTo(-214,-194,-234,-150);
    g.quadraticCurveTo(-248,-104,-240,-56);
    g.quadraticCurveTo(-60,-66,246,-58);
    g.closePath(); };
  body(); g.fillStyle=grad('body',-196,-56); g.fill();

  // TONGUE: soft pad peeking just above the throat line
  g.save(); g.translate(14,-160); g.rotate(0.26);
  g.fillStyle=F('body',0.8);
  g.beginPath(); g.ellipse(0,0,46,19,0,0,7); g.fill();
  g.strokeStyle=F('body',0.55); g.lineWidth=3; g.stroke();
  g.restore();

  // TOE CAP: rubber bumper painted inside the upper (follows sole color)
  g.save(); body(); g.clip();
  g.beginPath(); g.moveTo(158,-50); g.quadraticCurveTo(196,-96,228,-118);
  g.lineTo(275,-118); g.lineTo(275,10); g.lineTo(150,10); g.closePath();
  g.fillStyle=L('sole',0.08); g.fill();
  g.strokeStyle=F('sole',0.62); g.lineWidth=3;
  g.beginPath(); g.moveTo(158,-50); g.quadraticCurveTo(196,-96,228,-118); g.stroke();
  g.setLineDash([6,5]); g.strokeStyle='rgba(0,0,0,.22)'; g.lineWidth=2;
  g.beginPath(); g.moveTo(148,-44); g.quadraticCurveTo(186,-86,218,-108); g.stroke();
  g.setLineDash([]);
  g.restore();

  // stitches: heel panel seam + line above the sole
  g.setLineDash([7,6]); g.strokeStyle='rgba(255,255,255,.45)'; g.lineWidth=2.5;
  g.beginPath(); g.moveTo(-188,-60); g.quadraticCurveTo(-158,-130,-186,-188); g.stroke();
  g.beginPath(); g.moveTo(-234,-68); g.quadraticCurveTo(0,-76,236,-66); g.stroke();
  g.setLineDash([]);

  // ACCENT chevron on the side panel (clipped to the upper)
  g.save(); body(); g.clip();
  g.beginPath(); g.moveTo(-150,-58); g.lineTo(-70,-138); g.lineTo(10,-58);
  g.strokeStyle=F('accent',0.62); g.lineWidth=33; g.stroke();
  g.beginPath(); g.moveTo(-150,-58); g.lineTo(-70,-138); g.lineTo(10,-58);
  g.strokeStyle=css(c('accent')); g.lineWidth=25; g.stroke();
  g.restore();

  // crisp silhouette on top of inner details
  body(); g.strokeStyle=F('body',0.6); g.lineWidth=3; g.stroke();

  // HEEL TAB (accent)
  g.save(); g.translate(-176,-196); g.rotate(-0.12);
  g.fillStyle=css(c('accent'));
  g.beginPath(); g.roundRect(-26,-10,52,22,9); g.fill();
  g.strokeStyle=F('accent',0.62); g.lineWidth=2.5; g.stroke();
  g.restore();

  // COLLAR rim
  g.beginPath(); g.moveTo(-38,-162);
  g.quadraticCurveTo(-68,-190,-138,-192);
  g.quadraticCurveTo(-196,-190,-222,-158);
  g.strokeStyle=F('body',0.62); g.lineWidth=11; g.stroke();

  // LACE PANEL + rungs across the throat + eyelets (clipped to the upper)
  g.save(); body(); g.clip();
  const ax0=-30,ay0=-152, ax1=134,ay1=-108;
  const dx=ax1-ax0, dy=ay1-ay0;
  const rot=Math.atan2(dy,dx)+0.18;              // rung long axis ⊥ throat + tilt
  const ux=-Math.sin(rot), uy=Math.cos(rot);     // unit vector along a rung (into body)
  g.beginPath();
  g.moveTo(ax0-ux*26,ay0-uy*26); g.lineTo(ax1-ux*26,ay1-uy*26);
  g.lineTo(ax1+ux*34,ay1+uy*34); g.lineTo(ax0+ux*34,ay0+uy*34);
  g.closePath(); g.fillStyle='rgba(0,0,0,.10)'; g.fill();
  for(let i=0;i<4;i++){
    const t=0.12+0.76*i/3, x=ax0+dx*t+ux*6, y=ay0+dy*t+uy*6;
    g.save(); g.translate(x,y); g.rotate(rot);
    g.fillStyle=css(c('laces'));
    g.beginPath(); g.roundRect(-8,-24,16,48,8); g.fill();
    g.strokeStyle=F('laces',0.62); g.lineWidth=2.5; g.stroke();
    g.fillStyle='rgba(255,255,255,.35)';
    g.beginPath(); g.roundRect(-8,-24,6,48,4); g.fill();
    g.restore();
    g.fillStyle='rgba(0,0,0,.4)';
    g.beginPath(); g.arc(x+ux*30,y+uy*30,4,0,7); g.fill();
  }
  g.restore();

  // logo dot on heel
  g.beginPath(); g.arc(-196,-108,10,0,7);
  g.fillStyle=css(c('accent')); g.fill();
  g.strokeStyle='rgba(255,255,255,.7)'; g.lineWidth=2.5; g.stroke();
}

function renderShoe(g,cx,cy,s,rot,pulse){
  // ground shadow (unrotated)
  g.save(); g.translate(cx,cy);
  const sh=g.createRadialGradient(0,0,10,0,0,250*s);
  sh.addColorStop(0,'rgba(0,0,0,.42)'); sh.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=sh; g.beginPath(); g.ellipse(0,0,255*s,30*s,0,0,7); g.fill();
  g.restore();
  g.save(); g.translate(cx,cy-8*s);
  g.rotate(rot*0.05); const sc=s*(1+pulse*0.05); g.scale(sc,sc);
  drawSneaker(g);
  g.restore();
}

function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  // studio backdrop, softly tinted toward body color
  const bt=mix([26,28,44],S.colors.body.cur,0.10);
  const bg=ctx.createRadialGradient(vw/2,vh*0.32,60,vw/2,vh*0.55,Math.max(vw,vh)*0.85);
  bg.addColorStop(0,css(tint(bt,0.10))); bg.addColorStop(0.55,css(bt)); bg.addColorStop(1,'#0b0c14');
  ctx.fillStyle=bg; ctx.fillRect(0,0,vw,vh);

  const s=shoeScale(), [cx,cy]=shoeCenter();
  const bob=Math.sin(S.time*1.6)*9*s;

  // glow + podium disc
  const gl=ctx.createRadialGradient(cx,cy-140*s,20,cx,cy-140*s,340*s);
  gl.addColorStop(0,'rgba(255,255,255,.10)'); gl.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=gl; ctx.fillRect(cx-360*s,cy-500*s,720*s,600*s);
  ctx.fillStyle='rgba(255,255,255,.05)';
  ctx.beginPath(); ctx.ellipse(cx,cy+8*s,300*s,38*s,0,0,7); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.10)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.ellipse(cx,cy+8*s,300*s,38*s,0,0,7); ctx.stroke();

  renderShoe(ctx,cx,cy+bob*0.3,s,S.rot,S.pulse);

  // particles
  for(const p of S.parts){
    const a=1-p.age/p.life; ctx.globalAlpha=a; ctx.fillStyle=p.color;
    if(p.kind==='conf'){ ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r); ctx.restore(); }
    else { ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); }
  }
  ctx.globalAlpha=1;
  // floats
  for(const f of S.floats){
    ctx.globalAlpha=1-f.age/f.life; ctx.fillStyle=f.color;
    ctx.font='900 '+f.size+'px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.strokeStyle='rgba(0,0,0,.4)'; ctx.lineWidth=5;
    ctx.strokeText(f.txt,f.x,f.y); ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1;
  updateHand();
}

/* end-card shoe snapshot */
function renderEndShoe(){
  const ec=$('endCv'), g=ec.getContext('2d');
  const W=680,H=360; ec.width=W; ec.height=H;
  g.clearRect(0,0,W,H);
  renderShoe(g,W/2,H-52,1.05,0,0);
}

/* ---------- tutorial hand (points at the next useful DOM control) -------- */
function updateHand(){
  const h=$('hand');
  const idle=S.time-S.lastInput;
  if(S.phase!=='play'||idle<CONFIG.idleHint){ h.classList.remove('show'); return; }
  let el;
  if(pickedCount()===4) el=$('done');
  else{
    const zi=S.colors[ZONES[S.step].id].picked ? nextUnpicked() : S.step;
    if(zi===S.step) el=swEls[(S.step+2)%6];
    else el=tabEls[zi];
  }
  if(!el) { h.classList.remove('show'); return; }
  const r=el.getBoundingClientRect();
  h.style.left=(r.left+r.width*0.55)+'px';
  h.style.top=(r.top+r.height*0.72)+'px';
  h.classList.add('show');
}

/* ========================= MAIN LOOP ===================================== */
let last=performance.now();
function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min((t-last)/1000,1/30); last=t;
  if(!$('end').classList.contains('show')) update(dt);
  render();
}
function start(){ newGame(); requestAnimationFrame(frame); }
try{
  if(window.mraid){
    if(mraid.getState()==='loading') mraid.addEventListener('ready',start); else start();
  } else start();
}catch(e){ start(); }

// .closest('.btn'), not tagName: the tabs carry a <span class="tick"> child, so a
// tap can land on the span — and a cancelled touchstart cancels the click after it.
document.addEventListener('touchstart',e=>{
  if(!(e.target instanceof Element) || !e.target.closest('.btn')) e.preventDefault();
},{passive:false});

/* debug hooks for automated testing */
window.__game={S,CONFIG,ZONES,pick,setStep,finish,newGame,
  picked:pickedCount,
  tick:(frames=1,dt=1/60)=>{ for(let i=0;i<frames;i++) update(dt); render(); }};
</script>
